<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratex — Consola de tenant integración</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
          --accent:#38bdf8; --ok:#22c55e; --pend:#475569; --err:#ef4444; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; gap:12px;
           align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; min-width:220px; }
  header input { padding:8px 10px; background:#0b1220; color:var(--txt); border:1px solid var(--line);
                 border-radius:8px; font-size:13px; }
  .layout { display:flex; min-height:calc(100vh - 62px); }
  .steps { width:280px; border-right:1px solid var(--line); padding:12px 0; }
  .step { display:flex; gap:11px; align-items:flex-start; padding:10px 18px; cursor:pointer; border:none;
          background:none; color:var(--txt); width:100%; text-align:left; font-size:13.5px; }
  .step:hover { background:#172033; }
  .step.active { background:#172033; border-left:3px solid var(--accent); }
  .num { width:25px; height:25px; border-radius:50%; background:var(--pend); color:#fff; display:flex;
         align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0; }
  .step.done .num { background:var(--ok); }
  .step .tag { font-size:10px; color:var(--mut); display:block; margin-top:2px; }
  .content { flex:1; padding:26px 30px; max-width:820px; }
  .content h2 { margin:0 0 6px; font-size:20px; }
  .content p, .content li { color:#cbd5e1; line-height:1.55; font-size:14px; }
  .content a { color:var(--accent); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:16px 0; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:150px; }
  label { display:block; font-size:12.5px; color:var(--mut); margin:10px 0 4px; }
  input[type=text], input[type=number], input[type=password], textarea, select {
         width:100%; padding:9px 11px; background:#0b1220; color:var(--txt);
         border:1px solid var(--line); border-radius:8px; font-size:13px; }
  textarea { min-height:70px; resize:vertical; font-family:ui-monospace,monospace; }
  button.act { margin-top:14px; padding:10px 16px; background:var(--accent); color:#06283d; border:none;
               border-radius:8px; font-weight:600; cursor:pointer; }
  button.act:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#0b1220; color:var(--txt); border:1px solid var(--line); }
  pre { background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:12px;
        white-space:pre-wrap; word-break:break-word; font-size:12.5px; max-height:340px; overflow:auto; }
  .muted { color:var(--mut); font-size:12.5px; }
  code { background:#0b1220; padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .pill { display:inline-block; font-size:11px; padding:2px 9px; border-radius:99px; margin-left:6px; }
  .pill.ok { background:#052e16; color:var(--ok); }
  .pill.err { background:#3f1414; color:var(--err); }
  .pill.warn { background:#3f2d12; color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; }
  /* Empresa y ambiente a los que va lo que se hace en el paso (credencial de grupo). */
  .empInfo { margin:12px 0 4px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
             background:#0b1220; font-size:13px; }
  .empInfo.err { border-color:var(--err); background:#3f1414; }
  .empInfo .avisoAmb { color:#fecaca; margin-top:6px; line-height:1.45; font-weight:600; }
  .nota { margin-top:10px; padding:8px 11px; border-radius:8px; font-size:12.5px; line-height:1.45; }
  .nota.warn { background:#3f2d12; color:var(--warn); }
  .nota.err { background:#3f1414; color:#fecaca; }
</style>
</head>
<body>
<header>
  <h1>Consola de tenant integración</h1>
  <input id="apiKey" placeholder="X-API-KEY" style="width:270px">
  <input id="apiSecret" type="password" placeholder="X-API-SECRET" style="width:230px">
  <input id="certToken" type="password" placeholder="CERT_RUN_TOKEN" style="width:160px"
         title="Solo para correr las fases del set de pruebas">
  <select id="empresa" style="display:none;width:auto;max-width:340px"
          title="Credencial de grupo: las consultas, la aprobación, el emisor y las fases del set de esta página van a nombre de esta empresa"></select>
</header>

<div class="layout">
  <nav class="steps" id="nav"></nav>
  <main class="content" id="content"></main>
</div>

<script>
const API = location.origin + '/api';
const $ = id => document.getElementById(id);

// Las credenciales viven en sessionStorage: se borran al cerrar la pestaña. El
// api_secret no debe quedar guardado en el navegador mas alla de la sesion.
const KEYS = ['apiKey', 'apiSecret', 'certToken'];
KEYS.forEach(k => {
  const el = $(k);
  el.value = sessionStorage.getItem(k) || '';
  el.addEventListener('change', () => {
    sessionStorage.setItem(k, el.value.trim());
    // Otra credencial puede cubrir otras empresas.
    if (k !== 'certToken') cargarEmpresas().then(() => pintar());
  });
});

const creds = () => ({
  'X-API-KEY': $('apiKey').value.trim(),
  'X-API-SECRET': $('apiSecret').value.trim(),
});

function faltanCreds() {
  const c = creds();
  return !c['X-API-KEY'] || !c['X-API-SECRET'];
}

// Multi-empresa: una credencial de grupo cubre varias empresas y el RNC de cada
// llamada elige cual. La empresa del selector va como ?rnc= en las consultas
// (estado, bandejas, xml), como rnc_comprador al aprobar, como emisor
// precargado al emitir y en la fase 4, y como empresa_rnc en las fases 2/3/4 (el
// runner no envia nada si el set es de otra empresa o no esta en certecf). Sin
// grupo el selector no aparece y las llamadas salen igual que antes.
let empresas = [];
const EMPRESA_KEY = 'empresaRnc';
/** RNC elegido, solo si la credencial cubre mas de una empresa. */
function rncGrupo() {
  return empresas.length > 1 ? $('empresa').value : '';
}
function empresaSel() {
  return empresas.find(e => e.rnc === $('empresa').value) || empresas[0] || null;
}
async function cargarEmpresas() {
  const sel = $('empresa');
  empresas = [];
  if (!faltanCreds()) {
    try {
      const r = await call('GET', '/integracion/empresas');
      empresas = (r.status === 200 && r.json && Array.isArray(r.json.data)) ? r.json.data : [];
    } catch (e) { empresas = []; }
  }
  let guardada = '';
  try { guardada = sessionStorage.getItem(EMPRESA_KEY) || ''; } catch (e) { /* sin storage */ }
  sel.innerHTML = '';
  for (const e of empresas) {
    const o = document.createElement('option');
    o.value = e.rnc;
    o.textContent = 'Empresa: ' + e.nombre + ' — ' + e.rnc + (e.ambiente ? ' (' + e.ambiente + ')' : '');
    sel.appendChild(o);
  }
  // Sin eleccion guardada: la primera empresa que esta certificando, no la cabeza
  // del grupo (que suele ser la que ya esta en produccion).
  const certificando = empresas.find(e => e.ambiente === 'certecf') || empresas[0];
  sel.value = empresas.some(e => e.rnc === guardada) ? guardada : (certificando ? certificando.rnc : '');
  sel.style.display = empresas.length > 1 ? '' : 'none';
}
/** La empresa con la que se trabaja: la del selector, o la unica de la credencial. */
async function empresaActual() {
  if (!empresas.length) await cargarEmpresas();
  return empresaSel();
}
/** RNC solo digitos: el server tambien normaliza asi al elegir la empresa. */
const soloDigitos = v => String(v || '').replace(/\D/g, '');
function empresaPorRnc(rnc) {
  const r = soloDigitos(rnc);
  return r ? (empresas.find(e => soloDigitos(e.rnc) === r) || null) : null;
}
/** Cambia la empresa del selector sin redibujar el paso (no se pierde lo escrito). */
function seleccionarEmpresa(rnc) {
  $('empresa').value = rnc;
  try { sessionStorage.setItem(EMPRESA_KEY, rnc); } catch (e) { /* sin storage */ }
  pintarEmpresaInfo();
}

/**
 * Pinta en cada .empInfo del paso visible a que empresa va lo que se hace ahi y
 * en que ambiente esta. Fuera de certecf todo sale como e-CF REALES: aviso en
 * rojo. data-contexto="emision" (paso 2) sigue al RNC emisor del formulario,
 * que es el que elige la empresa en el server.
 */
function pintarEmpresaInfo() {
  document.querySelectorAll('.empInfo').forEach(el => {
    const emision = el.dataset.contexto === 'emision';
    const rncForm = emision && $('emRnc') ? soloDigitos($('emRnc').value) : '';
    const emp = rncForm ? empresaPorRnc(rncForm) : empresaSel();
    el.className = 'empInfo';
    el.textContent = '';
    if (!emp) {
      el.textContent = faltanCreds()
        ? 'Empresa: sin verificar — pon X-API-KEY y X-API-SECRET arriba.'
        : (empresas.length
          ? 'RNC ' + rncForm + ': no está entre las empresas de esta credencial (el server lo va a rechazar).'
          : 'Empresa: sin verificar — GET /integracion/empresas no respondió (revisa las credenciales en el paso 1).');
      return;
    }
    const amb = emp.ambiente || '';
    const linea = document.createElement('div');
    linea.append('Empresa: ');
    const nombre = document.createElement('b');
    nombre.textContent = emp.nombre;
    linea.append(nombre, ' — RNC ' + emp.rnc + ' — ambiente ');
    const pill = document.createElement('span');
    pill.className = 'pill ' + (amb === 'certecf' ? 'ok' : 'err');
    pill.style.marginLeft = '0';
    pill.textContent = amb || 'sin ambiente';
    linea.append(pill);
    el.appendChild(linea);
    if (amb !== 'certecf') {
      el.classList.add('err');
      const aviso = document.createElement('div');
      aviso.className = 'avisoAmb';
      // Solo ecf (o vacio, que el server trata como ecf) es produccion; testecf es otro ambiente de pruebas.
      const real = amb === 'ecf' || amb === '';
      aviso.textContent = !real
        ? 'Esta empresa está en "' + amb + '", no en certecf: lo que se envíe va a ese ambiente de la DGII, ' +
          'no al de certificación. ' + (emision ? 'Emitir pide confirmación.' : 'Las fases se niegan a enviar contra ella (el dry-run sí corre).')
        : emision
        ? 'Esta empresa NO está en certecf: lo que emitas aquí es un e-CF REAL de producción ante la DGII, ' +
          'con una secuencia real. Emitir pide confirmación.'
        : 'Esta empresa NO está en certecf: el set de pruebas saldría como e-CF REALES. Las fases se niegan a ' +
          'enviar contra ella (el dry-run sí corre). Elige arriba la empresa que se está certificando.';
      el.appendChild(aviso);
    }
  });
}

/**
 * Paso 2 llama al API directo (no pasa por el pre-flight de los runners): si la
 * empresa del emisor no esta en certecf, lo que sale es un e-CF REAL. Pide
 * confirmacion explicita nombrando la empresa.
 */
async function confirmarEmisionReal(rncEmisor) {
  if (faltanCreds()) return true; // call() avisa que faltan
  // Lista fresca, no la de cuando se abrio la pagina: una empresa promovida a ecf
  // mientras tanto (otra pestana, SQL) tiene que pedir confirmacion.
  let fresca = null;
  try {
    const r = await call('GET', '/integracion/empresas');
    if (r.status === 200 && r.json && Array.isArray(r.json.data)) fresca = r.json.data;
  } catch (e) { fresca = null; }
  if (!fresca || !fresca.length) {
    return confirm('No se pudo verificar el ambiente de la empresa (GET /integracion/empresas no respondió).\n\n' +
      'Si el RNC ' + (rncEmisor || '?') + ' ya está en producción (ecf), esto emitirá un e-CF REAL ante la DGII.\n\n' +
      '¿Emitir de todos modos?');
  }
  empresas = fresca;
  pintarEmpresaInfo();
  const emp = empresaPorRnc(rncEmisor);
  // Un RNC fuera de la credencial lo rechaza el server: no hay nada que confirmar.
  if (!emp || emp.ambiente === 'certecf') return true;
  if (emp.ambiente && emp.ambiente !== 'ecf') {
    return confirm('ATENCIÓN: ' + emp.nombre + ' (RNC ' + emp.rnc + ') está en ambiente "' + emp.ambiente +
      '", no en certecf: el e-CF va a ese ambiente de la DGII, no al de certificación.\n\n¿Emitir de todos modos?');
  }
  return confirm('ATENCIÓN: ' + emp.nombre + ' (RNC ' + emp.rnc + ') está en ambiente "' +
    (emp.ambiente || 'sin ambiente') + '", no en certecf.\n\n' +
    'Esto emitirá un e-CF REAL de producción ante la DGII, con una secuencia real de la empresa. ' +
    'No es una prueba.\n\n¿Emitir de todos modos?');
}

/** "NOMBRE — RNC" de una respuesta de /integracion/* (estado y xml traen rnc y empresa). */
function empresaDeRespuesta(j) {
  return (j && j.rnc) ? ((j.empresa ? j.empresa + ' — ' : '') + j.rnc) : '';
}
/** Si la respuesta no dice de que empresa es: la que se pidio (selector o la de la credencial). */
function empresaPedida() {
  const emp = empresaSel();
  return emp ? emp.nombre + ' — ' + emp.rnc + ' (pedida)' : '';
}

// La salida del runner es lo unico que queda de una corrida: cert_run.php borra
// su reporte al terminar y cada paso redibuja el contenido. Se guarda en
// localStorage (sobrevive a recargar la pagina). No lleva credenciales: el
// runner no imprime el api_secret ni el CERT_RUN_TOKEN.
const SALIDA_KEY = 'gratex_integracion_ultima_corrida';
let salida = null;
let corriendo = false;
try { salida = JSON.parse(localStorage.getItem(SALIDA_KEY) || 'null'); } catch (e) { salida = null; }

function guardarSalida() {
  try { localStorage.setItem(SALIDA_KEY, JSON.stringify(salida)); } catch (e) { /* sin storage: queda en memoria */ }
}

/** Relee la corrida guardada: otra pestaña puede estar escribiendola. */
function releerSalida() {
  if (corriendo) return;
  try {
    const guardada = JSON.parse(localStorage.getItem(SALIDA_KEY) || 'null');
    if (guardada) salida = guardada;
  } catch (e) { /* sin storage: queda la de memoria */ }
}
window.addEventListener('storage', ev => {
  if (ev.key === SALIDA_KEY) { releerSalida(); pintarSalida(); }
});

function pintarSalida() {
  releerSalida();
  const out = $('outRunner');
  if (!out || !salida) return;
  out.textContent = salida.texto;
  out.style.display = 'block';
  out.scrollTop = out.scrollHeight;
  // terminado=false fuera de una corrida de ESTA pestaña: o sigue en curso (otra
  // pestaña la esta recibiendo: llegaron datos hace poco) o se corto (red,
  // recarga). cert_run.php sigue corriendo en el server aunque el navegador se
  // vaya (ignore_user_abort): la salida esta incompleta y el runner puede seguir
  // mandando comprobantes y notas.
  const abierta = salida.terminado === false && !corriendo;
  const reciente = abierta && Date.now() - (salida.actualizado || 0) < 180000;
  const sigue = ' El server pudo seguir corriéndola (y mandando las notas): revisa el estado en el paso 3' +
    ' antes de volver a lanzarla.';
  let aviso = '';
  if (abierta && salida.cortada) {
    aviso = ' — INCOMPLETA: se cortó la conexión antes del final (' + salida.cortada + ').' + sigue;
  } else if (reciente) {
    aviso = ' — EN CURSO (en otra pestaña o sigue en el server): espera a que termine antes de volver a correr.';
  } else if (abierta) {
    aviso = ' — INCOMPLETA: se cortó la conexión o se recargó la página antes del final.' + sigue;
  }
  const emp = empresaDeCorrida(salida);
  $('runnerInfo').textContent = 'Última corrida: fase ' + salida.fase + (salida.dry ? ' (dry-run)' : '') +
    (emp.rnc ? ', ' + (emp.nombre ? emp.nombre + ' — ' : '') + 'RNC ' + emp.rnc : '') +
    ', ' + new Date(salida.cuando).toLocaleString() + aviso;
  $('runnerInfo').style.color = abierta ? 'var(--warn)' : '';
  $('runnerBar').style.display = 'block';
}

/** e-NCF (E + tipo + 10 digitos) en orden de aparicion, sin repetir. */
function encfsDe(texto) {
  const vistos = new Set();
  (texto.match(/E(?:3[1-4]|4[1-7])\d{10}/g) || []).forEach(e => vistos.add(e));
  return [...vistos];
}

/**
 * Empresa de la que es una corrida: la que imprimio el runner antes del primer
 * caso ("==> Empresa: X — RNC Y — ambiente Z", el RNC que de verdad se envio) o,
 * si no llego a imprimirla, la que se guardo al lanzarla. Las corridas guardadas
 * antes de este cambio no tienen ninguna de las dos.
 */
function empresaDeCorrida(s) {
  if (!s) return { rnc: '', nombre: '' };
  const m = String(s.texto || '').match(/^==> Empresa: (.+?) — RNC (\d{9,11}) — ambiente/m);
  if (m) return { rnc: m[2], nombre: m[1].startsWith('(') ? (s.empresa || '') : m[1] };
  return { rnc: s.rnc || '', nombre: s.empresa || '' };
}

function mostrarNota(el, clase, texto) {
  el.className = 'nota ' + clase;
  el.textContent = texto;
  el.style.display = texto ? 'block' : 'none';
}

/**
 * Antes de tomar los e-NCF de la ultima corrida (pasos 3 y 8): se consultan con
 * ?rnc= de la empresa del selector, asi que tienen que ser de esa empresa. Si la
 * corrida es de otra empresa de la credencial, cambia el selector a esa y lo
 * avisa; si no es de ninguna, avisa y devuelve false (no se mezclan empresas).
 */
async function alinearEmpresaConCorrida(nota) {
  mostrarNota(nota, '', '');
  if (!salida) return true;
  const corrida = empresaDeCorrida(salida);
  if (!corrida.rnc) {
    // Corrida de antes de este cambio. Sin grupo hay una sola empresa: nada que avisar.
    if (rncGrupo()) {
      mostrarNota(nota, 'warn', 'La corrida guardada no dice de qué empresa es (es de antes de este cambio): ' +
        'se consultan a nombre de la empresa elegida arriba. Verifica la columna Empresa.');
    }
    return true;
  }
  if (!empresas.length && !faltanCreds()) await cargarEmpresas();
  if (!empresas.length) {
    mostrarNota(nota, 'err', 'La última corrida es de RNC ' + corrida.rnc + ', pero no se pudo cargar la lista de ' +
      'empresas de la credencial (revisa las credenciales en el paso 1). No se cargan sus e-NCF: se consultarían ' +
      'sin saber a nombre de qué empresa.');
    return false;
  }
  const actual = empresaSel();
  if (actual && soloDigitos(actual.rnc) === corrida.rnc) return true;
  const emp = empresaPorRnc(corrida.rnc);
  if (emp) {
    seleccionarEmpresa(emp.rnc);
    mostrarNota(nota, 'warn', 'La última corrida es de ' + emp.nombre + ' (RNC ' + emp.rnc + '): el selector de ' +
      'Empresa cambió a esa empresa para consultarla a su nombre' +
      (actual ? ' (estaba en ' + actual.nombre + ').' : '.'));
    return true;
  }
  mostrarNota(nota, 'err', 'La última corrida es de RNC ' + corrida.rnc +
    (corrida.nombre ? ' (' + corrida.nombre + ')' : '') + ', que no está entre las empresas de esta credencial. ' +
    'No se cargan sus e-NCF: se consultarían a nombre de otra empresa.');
  return false;
}

async function call(method, path, body) {
  if (faltanCreds()) throw new Error('Pon X-API-KEY y X-API-SECRET arriba.');
  // Credencial de grupo: la empresa elegida arriba. /empresas no la lleva (lista el
  // grupo); /ecf no (el emisor del cuerpo ya elige la empresa).
  const rnc = rncGrupo();
  if (rnc && !path.startsWith('/integracion/empresas')) {
    if (method === 'GET' && path.startsWith('/integracion/') && !/[?&]rnc=/.test(path)) {
      path += (path.includes('?') ? '&' : '?') + 'rnc=' + encodeURIComponent(rnc);
    }
    if (method === 'POST' && path.startsWith('/integracion/aprobacion-comercial') && body && !body.rnc_comprador) {
      body = { ...body, rnc_comprador: rnc };
    }
  }
  const opts = { method, headers: { ...creds(), 'Accept': 'application/json' } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  const txt = await res.text();
  let json = null;
  try { json = JSON.parse(txt); } catch (e) { /* respuesta no JSON */ }
  return { status: res.status, json, txt };
}

// Muestra la respuesta cruda. El xml_firmado se saca del JSON y se ofrece como
// descarga: pegarlo entero en pantalla hace ilegible todo lo demas.
function render(outId, r, nombreXml) {
  const out = $(outId);
  let data = r.json;
  let xml = null;
  if (data && data.data && data.data.xml_firmado) {
    xml = data.data.xml_firmado;
    data = JSON.parse(JSON.stringify(data));
    data.data.xml_firmado = '[' + xml.length.toLocaleString() + ' bytes — ver botón de descarga]';
  }
  const ok = r.status >= 200 && r.status < 300 && data && data.status === true;
  out.innerHTML = '';
  const head = document.createElement('div');
  head.innerHTML = 'HTTP ' + r.status + '<span class="pill ' + (ok ? 'ok' : 'err') + '">' +
                   (ok ? 'OK' : 'FALLO') + '</span>';
  out.appendChild(head);
  const pre = document.createElement('pre');
  pre.textContent = data ? JSON.stringify(data, null, 2) : r.txt.slice(0, 4000);
  out.appendChild(pre);
  if (xml) {
    const b = document.createElement('button');
    b.className = 'act ghost';
    b.textContent = 'Descargar XML firmado';
    b.onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([xml], { type: 'application/xml' }));
      a.download = (nombreXml || 'ecf') + '.xml';
      a.click();
    };
    out.appendChild(b);
  }
  out.style.display = 'block';
}

const PASOS = [
  { n:1, t:'Credenciales y empresas', tag:'GET /integracion/empresas', body: () => `

let activo = 1;
function pintarNav() {
  $('nav').innerHTML = '';
  PASOS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'step' + (p.n === activo ? ' active' : '');
    b.innerHTML = `<span class="num">${p.n}</span><span class="label">${p.t}<span class="tag">${p.tag}</span></span>`;
    b.onclick = () => { activo = p.n; pintar(); };
    $('nav').appendChild(b);
  });
}

function pintar() {
  const p = PASOS.find(x => x.n === activo);
  pintarNav();
  $('content').innerHTML = `<h2>${p.t}</h2>` + p.body();
  wire(p.n);
}

function wire(n) {
  if (n === 1) {
    $('btnEmpresas').onclick = async (e) => {
      e.target.disabled = true;
      try { render('outEmpresas', await call('GET', '/integracion/empresas')); }
      catch (err) { $('outEmpresas').style.display = 'block'; $('outEmpresas').textContent = err.message; }
      finally { e.target.disabled = false; }
      // Refresca el selector de empresa (aparece arriba si la credencial cubre varias).
      cargarEmpresas().catch(() => {});
    };
  }

  if (n === 2) {
    // Prellenar emisor con la empresa elegida arriba (o la de la credencial).
    pintarEmpresaInfo();
    empresaActual().then(emp => {
      if (emp) { $('emRnc').value = emp.rnc || ''; $('emRazon').value = emp.nombre || ''; }
      pintarEmpresaInfo();
    }).catch(() => pintarEmpresaInfo());
    // El RNC emisor es el que elige la empresa en el server: el aviso lo sigue.
    $('emRnc').addEventListener('input', pintarEmpresaInfo);

    $('btnEmitir').onclick = async (e) => {
      // Teléfono opcional aquí, pero con el formato del XSD si viene.
      const errEmisor = errorContactoEmisor($('emDir').value, $('emTel').value, '', false);
      if (errEmisor) {
        $('outEmitir').style.display = 'block';
        $('outEmitir').textContent = errEmisor;
        return;
      }
      e.target.disabled = true;
      const payload = {
        tipo_ecf: $('emTipo').value,
        e_ncf: $('emEncf').value.trim(),
        emisor: Object.assign(
          { rnc: $('emRnc').value.trim(), razon_social: $('emRazon').value.trim(), direccion: $('emDir').value.trim() },
          $('emTel').value.trim() ? { telefono: telefonoDgii($('emTel').value) } : {}
        ),
        comprador: { rnc: $('emCompRnc').value.trim(), razon_social: $('emCompRazon').value.trim() },
        items: [{
          numero_linea: 1, indicador_facturacion: 1, indicador_bien_servicio: 2,
          nombre_item: $('emItem').value.trim(), unidad_medida: '43',
          cantidad: parseFloat($('emCant').value) || 1,
          precio_unitario: parseFloat($('emPrecio').value) || 0,
        }],
      };
      try {
        if (!(await confirmarEmisionReal(payload.emisor.rnc))) {
          $('outEmitir').style.display = 'block';
          $('outEmitir').textContent = 'Cancelado: no se emitió nada.';
          return;
        }
        render('outEmitir', await call('POST', '/integracion/ecf', payload), payload.e_ncf);
      }
      catch (err) { $('outEmitir').style.display = 'block'; $('outEmitir').textContent = err.message; }
      finally { e.target.disabled = false; }
    };
  }

  if (n === 3) {
    $('btnEstado').onclick = async (e) => {
      e.target.disabled = true;
      const q = new URLSearchParams({ e_ncf: $('stEncf').value.trim() });
      if ($('stTrack').value.trim()) q.set('track_id', $('stTrack').value.trim());
      if ($('stCod').value.trim()) q.set('codigo_seguridad', $('stCod').value.trim());
      try { render('outEstado', await call('GET', '/integracion/estado?' + q)); }
      catch (err) { $('outEstado').style.display = 'block'; $('outEstado').textContent = err.message; }
      finally { e.target.disabled = false; }
    };

    $('btnTomarCorrida').onclick = async () => {
      releerSalida();
      // Se consultan con ?rnc= del selector: primero, que sea la empresa de la corrida.
      if (!(await alinearEmpresaConCorrida($('stNota')))) { $('stLista').value = ''; return; }
      const lista = salida ? encfsDe(salida.texto) : [];
      $('stLista').value = lista.length ? lista.join('\n') : '';
      if (!lista.length) $('stLista').placeholder = 'No hay una corrida guardada en este navegador.';
    };

    $('btnEstadoLista').onclick = async (e) => {
      const out = $('outEstadoLista');
      const lista = encfsDe($('stLista').value.toUpperCase());
      out.style.display = 'block';
      if (!lista.length) { out.textContent = 'Pon al menos un e-NCF (ej. E310000000034).'; return; }
      if (faltanCreds()) { out.textContent = 'Pon X-API-KEY y X-API-SECRET arriba.'; return; }
      e.target.disabled = true;
      out.innerHTML = '';
      const resumen = document.createElement('div');
      out.appendChild(resumen);
      const tabla = document.createElement('table');
      // "Enviado" = el ultimo envio de ese e-NCF (el respaldo que se consulto): si
      // es de una corrida vieja, el estado tambien lo es.
      // "Empresa" = la que respondio (rnc/empresa de la respuesta): con credencial de
      // grupo, un NO_ENCONTRADO suele ser un e-NCF consultado a nombre de otra empresa.
      tabla.innerHTML = '<thead><tr><th>e-NCF</th><th>Empresa</th><th>Enviado</th><th>Estado DGII</th><th>Mensajes</th></tr></thead>';
      const cuerpo = document.createElement('tbody');
      tabla.appendChild(cuerpo);
      out.appendChild(tabla);
      const cuenta = { ok: 0, err: 0, warn: 0 };
      for (let i = 0; i < lista.length; i++) {
        resumen.textContent = 'Consultando ' + (i + 1) + ' de ' + lista.length + '...';
        const fila = document.createElement('tr');
        const celda = t => { const td = document.createElement('td'); td.textContent = t; fila.appendChild(td); return td; };
        celda(lista[i]);
        const tdEmpresa = celda(empresaPedida());
        const tdEnviado = celda('');
        let estado = '', clase = 'warn', mensajes = '';
        try {
          const r = await call('GET', '/integracion/estado?' + new URLSearchParams({ e_ncf: lista[i] }));
          const j = r.json || {};
          if (empresaDeRespuesta(j)) tdEmpresa.textContent = empresaDeRespuesta(j);
          if (r.status === 200 && j.status === true) {
            tdEnviado.textContent = j.fecha_emision || '';
            estado = j.estado || (j.consulta && j.consulta.estado) || '?';
            // Un aceptado trae mensajes:[{"valor":"","codigo":0}]: sin texto no se muestra.
            const ms = (j.consulta && Array.isArray(j.consulta.mensajes)) ? j.consulta.mensajes : [];
            mensajes = ms.map(m => {
              const valor = (m && typeof m === 'object') ? String(m.valor || '').trim() : String(m || '').trim();
              if (!valor) return '';
              return valor + (m && typeof m === 'object' && m.codigo !== undefined ? ' (' + m.codigo + ')' : '');
            }).filter(Boolean).join(' | ');
            clase = /RECHAZADO/i.test(estado) ? 'err' : (/ACEPTADO/i.test(estado) ? 'ok' : 'warn');
          } else {
            estado = 'HTTP ' + r.status;
            mensajes = (j && j.error) || r.txt.slice(0, 300);
          }
        } catch (err) {
          estado = 'ERROR';
          mensajes = err.message;
        }
        cuenta[clase]++;
        const tdEstado = celda('');
        const pill = document.createElement('span');
        pill.className = 'pill ' + clase;
        pill.style.marginLeft = '0';
        pill.textContent = estado;
        tdEstado.appendChild(pill);
        celda(mensajes);
        cuerpo.appendChild(fila);
      }
      resumen.textContent = lista.length + ' consultados: ' + cuenta.ok + ' aceptados, ' + cuenta.err +
        ' rechazados, ' + cuenta.warn + ' en proceso / sin respuesta.';
      e.target.disabled = false;
    };
  }

  if (n === 4) {
    const ver = async (ruta, btn) => {
      btn.disabled = true;
      try { render('outBandeja', await call('GET', ruta + '?page=1&pageSize=20')); }
      catch (err) { $('outBandeja').style.display = 'block'; $('outBandeja').textContent = err.message; }
      finally { btn.disabled = false; }
    };
    $('btnRecibidos').onclick = (e) => ver('/integracion/recibidos', e.target);
    $('btnAprobaciones').onclick = (e) => ver('/integracion/aprobaciones', e.target);
  }

  if (n === 5) {
    $('btnAprobar').onclick = async (e) => {
      e.target.disabled = true;
      const payload = {
        rnc_emisor: $('acRnc').value.trim(),
        e_ncf: $('acEncf').value.trim(),
        fecha_emision: $('acFecha').value.trim(),
        monto_total: parseFloat($('acMonto').value) || 0,
        estado: $('acEstado').value,
      };
      if ($('acMotivo').value.trim()) payload.detalle_motivo = $('acMotivo').value.trim();
      try { render('outAprobar', await call('POST', '/integracion/aprobacion-comercial', payload)); }
      catch (err) { $('outAprobar').style.display = 'block'; $('outAprobar').textContent = err.message; }
      finally { e.target.disabled = false; }
    };
  }

  if (n === 6) {
    // El emisor de la fase 4 es la empresa que se certifica: la elegida arriba
    // (credencial de grupo) o la de la credencial. Se rellena para no confundirlo
    // con el RNC del comprador de prueba de DGII (131880681), el error facil aqui.
    // Cada fase muestra a que empresa va y su ambiente (fuera de certecf, en rojo).
    pintarEmpresaInfo();
    // Vacio = el default del server (31-12 del ano siguiente): se muestra cual es.
    $('f4venc').placeholder = '31-12-' + (new Date().getFullYear() + 1);
    empresaActual().then(emp => {
      pintarEmpresaInfo();
      if (!emp) return;
      if (!$('f4rnc').value) $('f4rnc').value = emp.rnc || '';
      if (!$('f4razon').value) $('f4razon').value = emp.nombre || '';
    }).catch(() => pintarEmpresaInfo());

    document.querySelectorAll('button[data-fase]').forEach(btn => {
      btn.onclick = async () => correrFase(btn);
      btn.disabled = corriendo;
    });

    $('btnBajarSalida').onclick = () => {
      if (!salida) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([salida.texto], { type: 'text/plain' }));
      a.download = 'fase' + salida.fase + '_' + salida.cuando.replace(/[:.]/g, '-') + '.txt';
      a.click();
    };
    pintarSalida();
  }

  if (n === 7) {
    // Con credencial de grupo, el respaldo a validar es el de la empresa elegida.
    if (rncGrupo()) {
      const emp = empresaSel();
      if (emp && emp.id && !$('vxTenant').value) $('vxTenant').value = String(emp.id);
    }
    $('btnValidar').onclick = async (e) => {
      const out = $('outValidar');
      if (!$('certToken').value.trim()) {
        out.style.display = 'block';
        out.textContent = 'Falta el CERT_RUN_TOKEN (arriba).';
        return;
      }
      e.target.disabled = true;
      out.style.display = 'block';
      out.textContent = 'Validando...\n\n';
      const q = new URLSearchParams({ token: $('certToken').value.trim() });
      if ($('vxTenant').value.trim()) q.set('tenant_id', $('vxTenant').value.trim());
      try {
        const res = await fetch('validar_xml_dgii.php?' + q);
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        out.textContent = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          out.textContent += dec.decode(value, { stream: true });
          out.scrollTop = out.scrollHeight;
        }
      } catch (err) {
        out.textContent += '\nError de red: ' + err.message + '\n';
      } finally {
        e.target.disabled = false;
      }
    };
  }

  if (n === 8) {
    $('urlsWs').textContent =
      `Recepción e-CF:        ${location.origin}/api/ecf/recepcion\n` +
      `Aprobación Comercial:  ${location.origin}/api/ecf/aprobacion-comercial\n` +
      `Autenticación:         ${location.origin}/api/ecf/autenticacion`;
    wireXmlIntegros();
  }
}

/**
 * e-NCF que salieron por RFCE (E32 <250k) en una salida del runner: el bloque
 * "[i/N] caso (E32, E32...)" seguido de una linea "OK  estado=RFCE_...".
 */
function rfceDe(texto) {
  const vistos = new Set();
  let actual = null;
  for (const linea of texto.split('\n')) {
    const cab = linea.match(/^\[\d+\/\d+\].*\((E\d{2}), (E\d{12})\)\s*$/);
    if (cab) { actual = cab[2]; continue; }
    if (actual && /^\s+OK\s+estado=RFCE_/.test(linea)) { vistos.add(actual); actual = null; }
  }
  return [...vistos];
}

function bajarArchivo(nombre, contenido) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], { type: 'application/xml' }));
  a.download = nombre;
  a.click();
}

// Paso 8: XML integros de los RFCE. Cada fila guarda lo bajado; "Descargar los
// verificados" solo toma los que la DGII confirmo con su codigo de seguridad.
let xmlFilas = [];
function wireXmlIntegros() {
  const rnc = () => (xmlFilas.find(f => f.rnc) || {}).rnc || '';
  const nombre = f => ($('xmlConRnc').checked && f.rnc ? f.rnc : '') + f.encf + '.xml';
  const ejemplo = () => {
    $('xmlEjemplo').textContent = (rnc() || 'RNC') + 'E320000000012.xml';
  };
  ejemplo();
  empresaActual().then(emp => {
    if (emp && emp.rnc) $('xmlEjemplo').textContent = emp.rnc + 'E320000000012.xml';
  }).catch(() => {});

  $('btnXmlTomar').onclick = async () => {
    releerSalida();
    // Se bajan y verifican con ?rnc= del selector: primero, que sea la empresa de la corrida.
    if (!(await alinearEmpresaConCorrida($('xmlNota')))) { $('xmlLista').value = ''; return; }
    const lista = salida ? rfceDe(salida.texto) : [];
    $('xmlLista').value = lista.join('\n');
    if (!lista.length) {
      $('xmlLista').placeholder = 'No hay RFCE en la corrida guardada en este navegador: escribe los e-NCF (E32 < 250k).';
    }
  };

  $('btnXmlTodos').onclick = async () => {
    const ok = xmlFilas.filter(f => f.verificado);
    for (const f of ok) {
      bajarArchivo(nombre(f), f.xml);
      // Una pausa corta: el navegador agrupa (y a veces bloquea) descargas seguidas.
      await new Promise(res => setTimeout(res, 400));
    }
  };

  $('btnXmlBuscar').onclick = async (e) => {
    const out = $('outXml');
    const lista = encfsDe($('xmlLista').value.toUpperCase());
    out.style.display = 'block';
    if (!lista.length) { out.textContent = 'Pon al menos un e-NCF (ej. E320000000012).'; return; }
    if (faltanCreds()) { out.textContent = 'Pon X-API-KEY y X-API-SECRET arriba.'; return; }
    e.target.disabled = true;
    $('btnXmlTodos').disabled = true;
    const filas = [];
    xmlFilas = filas;
    out.innerHTML = '';
    const resumen = document.createElement('div');
    out.appendChild(resumen);
    const tabla = document.createElement('table');
    tabla.innerHTML = '<thead><tr><th>e-NCF</th><th>Empresa</th><th>Enviado</th><th>Código seg.</th><th>Verificación DGII</th><th></th></tr></thead>';
    const cuerpo = document.createElement('tbody');
    tabla.appendChild(cuerpo);
    out.appendChild(tabla);

    for (let i = 0; i < lista.length; i++) {
      resumen.textContent = 'Buscando ' + (i + 1) + ' de ' + lista.length + '...';
      const f = { encf: lista[i], xml: null, verificado: false, rnc: '' };
      const fila = document.createElement('tr');
      const celda = t => { const td = document.createElement('td'); td.textContent = t; fila.appendChild(td); return td; };
      celda(f.encf);
      const tdEmpresa = celda(empresaPedida());
      const tdFecha = celda('');
      const tdCodigo = celda('');
      const tdEstado = celda('');
      const tdAccion = celda('');
      const pill = (clase, texto) => {
        const s = document.createElement('span');
        s.className = 'pill ' + clase;
        s.style.marginLeft = '0';
        s.textContent = texto;
        tdEstado.textContent = '';
        tdEstado.appendChild(s);
      };
      cuerpo.appendChild(fila);
      try {
        const r = await call('GET', '/integracion/xml?' + new URLSearchParams({ e_ncf: f.encf }));
        const j = r.json || {};
        if (empresaDeRespuesta(j)) tdEmpresa.textContent = empresaDeRespuesta(j);
        if (r.status !== 200 || j.status !== true || !j.xml_firmado) {
          pill('warn', 'HTTP ' + r.status);
          tdAccion.textContent = (j && j.error) || r.txt.slice(0, 200);
          filas.push(f);
          continue;
        }
        f.xml = j.xml_firmado;
        f.rnc = j.rnc || '';
        tdFecha.textContent = j.fecha_emision || '';
        tdCodigo.textContent = j.codigo_seguridad || '';
        // RFCE: por codigo de seguridad (que es el de ESTE xml). e-CF normal: por track_id.
        const q = new URLSearchParams({ e_ncf: f.encf });
        if (j.flujo === 'RFCE' && j.codigo_seguridad) q.set('codigo_seguridad', j.codigo_seguridad);
        else if (j.track_id) q.set('track_id', j.track_id);
        const v = await call('GET', '/integracion/estado?' + q);
        const vj = v.json || {};
        const estado = (v.status === 200 && vj.status === true) ? (vj.estado || '?') : 'HTTP ' + v.status;
        f.verificado = /^(RFCE_)?ACEPTADO(_CONDICIONAL)?$/i.test(estado);
        pill(f.verificado ? 'ok' : (/RECHAZADO/i.test(estado) ? 'err' : 'warn'),
          f.verificado ? estado : estado + (j.flujo === 'RFCE' && /NO_ENCONTRADO|RECHAZADO/i.test(estado) ? ' — este XML no coincide con un RFCE aceptado' : (vj && vj.error ? ' — ' + vj.error : '')));
        tdAccion.textContent = '';
        const b = document.createElement('button');
        b.className = 'act ghost';
        b.style.margin = '0';
        b.style.padding = '4px 10px';
        b.textContent = 'Descargar';
        b.onclick = () => bajarArchivo(nombre(f), f.xml);
        tdAccion.appendChild(b);
      } catch (err) {
        pill('warn', 'ERROR');
        tdAccion.textContent = err.message;
      }
      filas.push(f);
    }
    if (xmlFilas !== filas) return; // otra busqueda la reemplazo
    const verificados = filas.filter(x => x.verificado).length;
    resumen.textContent = lista.length + ' buscados: ' + verificados + ' verificados contra la DGII.' +
      (verificados < lista.length ? ' Revisa los demás antes de subirlos.' : ' Listos para el portal.');
    ejemplo();
    e.target.disabled = false;
    $('btnXmlTodos').disabled = verificados === 0;
  };
  $('xmlConRnc').onchange = ejemplo;
}

/** Vacio o un relleno como "N/D": no es un dato del emisor. */
function esRelleno(v) {
  return /^(n[\s.\/]*[da][\s.]*|-+|\.+)?$/i.test(String(v || '').trim());
}

/** Telefono como lo pide el XSD de la DGII (999-999-9999), o null si no son 10 digitos. */
function telefonoDgii(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') d = d.slice(1);
  return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : null;
}

/**
 * Contacto del emisor contra el XSD del e-CF: un dato fuera de formato deja el
 * XML invalido y la DGII rechaza TODOS los comprobantes de la corrida. Devuelve
 * el error, o '' si todo esta bien.
 */
function errorContactoEmisor(dir, tel, correo, telObligatorio) {
  dir = String(dir || '').trim(); tel = String(tel || '').trim(); correo = String(correo || '').trim();
  if (esRelleno(dir)) return 'Pon la dirección real del emisor: sale en la Representación Impresa y la DGII la rechaza sin ella ("N/D" no cuenta).';
  if (dir.length > 100) return 'La dirección del emisor pasa de 100 caracteres: la DGII no la acepta en el XML.';
  if (tel === '' && telObligatorio) return 'Pon el teléfono del emisor: sale en la Representación Impresa y la DGII la rechaza sin él.';
  if (tel !== '' && !telefonoDgii(tel)) return 'El teléfono del emisor tiene que tener 10 dígitos (809-555-0100): con otro formato el XML no es válido.';
  if (correo !== '' && (correo.length > 80 || !/^\w+([-+.']\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$/.test(correo)))
    return 'El correo del emisor no tiene un formato que la DGII acepte.';
  return '';
}

async function correrFase(btn) {
  const fase = btn.dataset.fase;
  const out = $('outRunner');
  if (faltanCreds() || !$('certToken').value.trim()) {
    out.style.display = 'block';
    out.textContent = 'Faltan X-API-KEY, X-API-SECRET y CERT_RUN_TOKEN (arriba).';
    return;
  }

  const fd = new FormData();
  fd.append('token', $('certToken').value.trim());
  fd.append('fase', fase);
  fd.append('api', API);
  fd.append('api_key', $('apiKey').value.trim());
  fd.append('api_secret', $('apiSecret').value.trim());
  if (btn.dataset.dry) fd.append('dry-run', '1');

  if (fase === '2' || fase === '3') {
    const input = $(fase === '2' ? 'f2xlsx' : 'f3xlsx');
    if (!input.files[0]) { out.style.display = 'block'; out.textContent = 'Sube el xlsx del set de pruebas.'; return; }
    fd.append('xlsx', input.files[0]);
    if (fase === '2' && $('f2filter').value.trim()) fd.append('filter', $('f2filter').value.trim());
  }
  if (fase === '2') {
    // 0 = mandar las notas sin esperar (el comportamiento de antes). Nada valida
    // el min="30" del input: se acota aqui (un negativo apagaba la espera).
    const espera = Math.min(1800, Math.max(30, Math.round(Number($('f2espera').value)) || 300));
    fd.append('nota-wait-accepted', $('f2esperar').checked ? String(espera) : '0');
  }
  if (fase === '4') {
    // La RI de cada comprobante sale de su XML: sin direccion y telefono reales
    // la DGII la rechaza, y el XML firmado ya no se puede corregir.
    const errEmisor = errorContactoEmisor($('f4dir').value, $('f4tel').value, $('f4correo').value, true);
    if (errEmisor) {
      out.style.display = 'block';
      out.textContent = errEmisor;
      return;
    }
    fd.append('encf_start', $('f4encf').value.trim());
    fd.append('emisor_rnc', $('f4rnc').value.trim());
    fd.append('emisor_razon_social', $('f4razon').value.trim());
    fd.append('emisor_direccion', $('f4dir').value.trim());
    fd.append('emisor_telefono', telefonoDgii($('f4tel').value));
    if ($('f4correo').value.trim()) fd.append('emisor_correo', $('f4correo').value.trim());
    if ($('f4venc').value.trim()) fd.append('fecha_venc_secuencia', $('f4venc').value.trim());
    if ($('f4counts').value.trim()) fd.append('counts', $('f4counts').value.trim());
  }

  corriendo = true;
  document.querySelectorAll('button[data-fase]').forEach(b => b.disabled = true);
  // La empresa elegida va como empresa_rnc en todas las fases: el runner no envía
  // nada si el set (RNCEmisor / RNCComprador del xlsx, o el RNC emisor de la fase 4)
  // es de otra, y aparte verifica en /integracion/empresas que esté en certecf.
  let emp = null;
  try { emp = await empresaActual(); } catch (e) { emp = null; }
  const rncEmpresa = emp ? soloDigitos(emp.rnc) : '';
  if (rncEmpresa) fd.append('empresa_rnc', rncEmpresa);
  // La corrida guarda de qué empresa es: los pasos 3 y 8 consultan sus e-NCF a su nombre.
  salida = { fase, dry: !!btn.dataset.dry, cuando: new Date().toISOString(), terminado: false,
             actualizado: Date.now(),
             rnc: rncEmpresa || (fase === '4' ? soloDigitos($('f4rnc').value) : ''),
             empresa: emp ? (emp.nombre || '') : '',
             texto: 'Corriendo fase ' + fase + (btn.dataset.dry ? ' (dry-run)' : '') +
               (emp ? ' — ' + emp.nombre + ' (RNC ' + emp.rnc + ', ' + (emp.ambiente || 'sin ambiente') + ')' : '') +
               '...\n\n' };
  guardarSalida();
  pintarSalida();
  // Se escribe en `salida` (no solo en el <pre>): si el usuario cambia de paso
  // mientras corre, el <pre> se redibuja y la corrida sigue llegando aqui.
  const anexar = t => {
    salida.texto += t;
    salida.actualizado = Date.now();
    guardarSalida();
    const o = $('outRunner');
    if (o) { o.textContent = salida.texto; o.scrollTop = o.scrollHeight; }
  };
  try {
    const res = await fetch('cert_run.php', { method: 'POST', body: fd });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      anexar(dec.decode(value, { stream: true }));
    }
    // Solo un stream que llego al final cuenta como terminado; un corte de red
    // deja terminado=false y la barra avisa que el server pudo seguir.
    salida.terminado = true;
  } catch (e) {
    salida.cortada = e.message || 'error de red';
    anexar('\nError de red: ' + e.message + '\n');
  } finally {
    corriendo = false;
    guardarSalida();
    pintarSalida();
    document.querySelectorAll('button[data-fase]').forEach(b => b.disabled = false);
  }
}

$('empresa').addEventListener('change', () => {
  try { sessionStorage.setItem(EMPRESA_KEY, $('empresa').value); } catch (e) { /* sin storage */ }
  pintar(); // los campos precargados (emisor, tenant_id) toman la empresa nueva
});

pintar();
// Con credenciales guardadas en la sesion, el selector aparece solo si la
// credencial cubre varias empresas; entonces se redibuja con la elegida.
cargarEmpresas().then(() => { if (empresas.length > 1) pintar(); else pintarEmpresaInfo(); }).catch(() => {});
</script>
